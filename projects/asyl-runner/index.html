<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Асыл: Городской побег</title><style>

adius:22px;background:linear-gradient(135deg,#140f1c 0%,#1d1226 38%,#2a0f1b 100%);color:#f5e8ff;box-shadow:14px 14px 0 rgba(0,0,0,.7),0 0 0 2px rgba(118,72,121,.35);transform:rotate(-.3deg);position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:12px;border:2px solid rgba(191,132,182,.22);border-radius:16px;pointer-events:none}.card::after{content:"";position:absolute;inset:auto 18px 10px 18px;height:10px;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(163,68,93,.5),transparent);pointer-events:none}h1{margin:6px 0 0;font-size:clamp(39px,7vw,78px);line-height:.86;text-transform:uppercase;letter-spacing:-.04em}.red{color:#d35572;font-weight:1000;font-style:italic;letter-spacing:.08em}.controls{display:flex;gap:10px;margin:18px 0}.controls span{flex:1;padding:12px 10px;background:rgba(17,11,23,.75);border:2px solid rgba(161,104,160,.6);border-radius:12px;text-align:center;font-weight:800;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.22)}button,input{pointer-events:auto;border:3px solid #251426;border-radius:12px;padding:13px 22px;font:900 18px inherit}button{background:linear-gradient(180deg,#3d214f 0%,#27182f 100%);color:#f9ebff;box-shadow:6px 6px 0 #09090d;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}button:hover{filter:brightness(1.08)}button:active{translate:3px 3px;box-shadow:2px 2px 0 #09090d}input{display:block;width:100%;margin:18px 0;background:rgba(255,255,255,.04);color:#fff;box-shadow:inset 0 0 0 1px rgba(149,123,169,.3);outline:none}input::placeholder{color:rgba(255,255,255,.5)}input:focus{border-color:#a34f6a;box-shadow:0 0 0 3px rgba(163,79,106,.18);background:rgba(255,255,255,.06)}.menu-buttons{display:flex;gap:12px;flex-wrap:wrap}.menu-buttons button{flex:1 1 180px;min-width:140px}.menu-buttons button:nth-child(2){background:linear-gradient(180deg,#6f1d35 0%,#3d0b18 100%);color:#fff}.menu-buttons button:nth-child(3){background:linear-gradient(180deg,#2b1734 0%,#1a10 <div id="ui"><div class="stats"><span class="pill">🏃 <b id="meters">0</b> м</span><span class="pill">🔎 <b id="clues">0</b></span></div><div id="danger"><i></i></div><div id="banner"></div><div class="power" id="power"></div></div>

<style>#ending{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#000;opacity:0;transition:opacity 1.4s;color:#b50f18}#ending.show{display:grid;opacity:1}#deathText{display:none;font:1000 clamp(70px,16vw,190px)/1 system-ui,sans-serif;letter-spacing:.08em;text-shadow:0 0 24px #7b0000}#endingVideo{display:none;width:min(100vw,1000px);max-height:100vh;background:#000}#endingAgain{display:none;position:absolute;bottom:24px;z-index:24}#ending.death #deathText,#ending.death #endingAgain,#ending.video #endingVideo,#ending.video #endingAgain{display:block}#finalStats{position:absolute;z-index:25;top:18px;left:50%;width:min(760px,94vw);translate:-50% -160%;padding:12px 16px;border:3px solid #f4dfab;border-radius:17px;background:#111722e8;color:#fff;box-shadow:0 10px 35px #000b,0 0 20px #ffd86a44;text-align:center;transition:translate .75s cubic-bezier(.18,.89,.3,1.28)}#ending.show #finalStats{translate:-50% 0}.final-title{color:#ffd35f;font-weight:1000;letter-spacing:.14em}.final-items{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}.final-items div{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 7px;padding:8px;border:2px solid #ffffff55;border-radius:11px;background:#ffffff12;font-size:22px;opacity:0;transform:translateY(-24px) scale(.8);animation:statIn .48s forwards}.final-items div:nth-child(1){animation-delay:.65s}.final-items div:nth-child(2){animation-delay:.85s}.final-items div:nth-child(3){animation-delay:1.05s}.final-items div:nth-child(4){animation-delay:1.25s}.final-items b{font-size:clamp(19px,3vw,29px)}.final-items small{grid-column:2;color:#cbd3dc;font-weight:800}@keyframes statIn{70%{transform:translateY(4px) scale(1.06)}to{opacity:1;transform:none}}@media(max-width:560px){.final-items{grid-template-columns:repeat(2,1fr)}#finalStats{top:8px;padding:8px}.final-items div{padding:5px}}</style>
<style>
.final-items div:nth-child(5){animation-delay:1.48s!important;border-color:#ffd35f!important;background:linear-gradient(135deg,#6b3f0a99,#201307dd)!important;box-shadow:0 0 20px #ffd35f55}

#startBtn,#leaderBtn,#leaderBack,#againBtn,#endingAgain{background:linear-gradient(180deg,#f3ddaa 0%,#d7b87c 100%)!important;border-color:rgba(126,89,45,.35)!important;color:#1d120c!important;box-shadow:0 8px 0 rgba(69,46,20,.75)!important}
