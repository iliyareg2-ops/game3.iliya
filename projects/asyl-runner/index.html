<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Асыл: Городской побег</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131a;font-family:system-ui,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:900}.stats{display:flex;justify-content:space-between;padding:18px;font-size:clamp(15px,2vw,22px)}.pill{background:#151922d9;border:2px solid #f7e5bd;border-radius:14px;padding:9px 14px;box-shadow:4px 4px #0007}#danger{position:absolute;left:50%;top:23px;translate:-50%;width:min(330px,38vw);height:17px;background:#171920;border:3px solid #f7e5bd;border-radius:10px;overflow:hidden}#danger i{display:block;height:100%;width:18%;background:linear-gradient(90deg,#f5c85b,#e34d4d);transition:.2s}.title{position:absolute;left:18px;bottom:18px;letter-spacing:.12em}.power{position:absolute;right:18px;bottom:18px;color:#ffd35f}#intro,#over,#leaderboard{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(circle at 50% 25%,#35414b,#0b0e14 70%);color:#fff}.card{width:min(650px,90vw);padding:30px;border:3px solid #171717;border-radius:18px;background:#eee3ca;color:#171717;box-shadow:13px 13px #0009;transform:rotate(-.4deg)}h1{margin:5px 0;font-size:clamp(39px,7vw,78px);line-height:.86;text-transform:uppercase}.red{color:#a93333;font-weight:1000;font-style:italic}.controls{display:flex;gap:8px;margin:18px 0}.controls span{flex:1;padding:10px;background:#fff;border:2px solid #171717;border-radius:9px;text-align:center}button,input{pointer-events:auto;border:3px solid #171717;border-radius:11px;padding:13px 22px;font:900 19px inherit}button{background:#f5c85b;box-shadow:5px 5px #171717;cursor:pointer}button:active{translate:3px 3px;box-shadow:2px 2px #171717}input{display:block;width:100%;margin:18px 0;background:#fff}.menu-buttons{display:flex;gap:14px;flex-wrap:wrap}.menu-buttons button{flex:1}#nickError{min-height:20px;margin:9px 0 0;color:#a20d18;font-weight:900}#leaderboard{display:none;z-index:8}#leaderRows{margin:18px 0;padding:0;list-style:none;max-height:48vh;overflow:auto}#leaderRows li{display:flex;justify-content:space-between;gap:20px;padding:10px 12px;border-bottom:2px solid #171717;font-weight:900}#over{display:none;background:#090b10df}#banner{position:absolute;left:50%;top:17%;translate:-50%;font-size:clamp(25px,4vw,54px);opacity:0;transition:.25s;text-align:center}.small{opacity:.65;font-size:13px}</style></head><body>
<div id="ui"><div class="stats"><span class="pill">🏃 <b id="meters">0</b> м</span><span class="pill">🔎 <b id="clues">0</b></span><span class="pill">★ <b id="score">0</b></span></div><div id="danger"><i></i></div><div id="banner"></div><div class="power" id="power"></div></div>
<section id="intro"><div class="card"><div class="red">ДЕЛО №01 · ПРОГУЛКА</div><input id="nickname" maxlength="18" autocomplete="nickname" placeholder="Введи свой ник"><div class="controls"><span>← →<br>сменить полосу</span><span>↑ / Space<br>прыжок</span><span>↓<br>подкат</span></div><div class="menu-buttons"><button id="startBtn">Начать</button><button id="hardBtn" style="background:#451322;color:#fff">HARD</button><button id="leaderBtn">Лидерборд</button><button id="hardLeaderBtn" style="background:#260812;color:#fff">HARD ТОП</button></div><p id="nickError"></p></div></section>
<section id="leaderboard"><div class="card"><div class="red" id="leaderTitle">ЛИДЕРБОРД · КИЛОМЕТРЫ</div><ol id="leaderRows"></ol><button id="leaderBack">Назад</button></div></section>
<section id="over"><div class="card"><div class="red">КАРАПУЗ ДОГНАЛ</div><h1>Погоня окончена</h1><p id="result"></p><button id="againBtn">Попробовать снова</button></div></section>
<section id="ending"><div id="finalStats"><div class="final-title">ИТОГИ ЗАБЕГА</div><div class="final-items"><div>🔎<b id="finalClues">0</b><small>улики</small></div><div>🛣️<b id="finalKm">0.00</b><small>км</small></div><div>★<b id="finalScore">0</b><small>очки</small></div><div>👥<b id="finalPeople">0</b><small>людей</small></div><div id="rankCard">🏆<b id="finalRank">—</b><small id="finalRankMode">место</small></div></div></div><div id="deathText">СМЕРТЬ</div><video id="endingVideo" src="final-video.mp4" playsinline controls></video><button id="endingAgain">Попробовать снова</button></section>
<style>#ending{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#000;opacity:0;transition:opacity 1.4s;color:#b50f18}#ending.show{display:grid;opacity:1}#deathText{display:none;font:1000 clamp(70px,16vw,190px)/1 system-ui,sans-serif;letter-spacing:.08em;text-shadow:0 0 24px #7b0000}#endingVideo{display:none;width:min(100vw,1000px);max-height:100vh;background:#000}#endingAgain{display:none;position:absolute;bottom:24px;z-index:24}#ending.death #deathText,#ending.death #endingAgain,#ending.video #endingVideo,#ending.video #endingAgain{display:block}#finalStats{position:absolute;z-index:25;top:18px;left:50%;width:min(760px,94vw);translate:-50% -160%;padding:12px 16px;border:3px solid #f4dfab;border-radius:17px;background:#111722e8;color:#fff;box-shadow:0 10px 35px #000b,0 0 20px #ffd86a44;text-align:center;transition:translate .75s cubic-bezier(.18,.89,.3,1.28)}#ending.show #finalStats{translate:-50% 0}.final-title{color:#ffd35f;font-weight:1000;letter-spacing:.14em}.final-items{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}.final-items div{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 7px;padding:8px;border:2px solid #ffffff55;border-radius:11px;background:#ffffff12;font-size:22px;opacity:0;transform:translateY(-24px) scale(.8);animation:statIn .48s forwards}.final-items div:nth-child(1){animation-delay:.65s}.final-items div:nth-child(2){animation-delay:.85s}.final-items div:nth-child(3){animation-delay:1.05s}.final-items div:nth-child(4){animation-delay:1.25s}.final-items b{font-size:clamp(19px,3vw,29px)}.final-items small{grid-column:2;color:#cbd3dc;font-weight:800}@keyframes statIn{70%{transform:translateY(4px) scale(1.06)}to{opacity:1;transform:none}}@media(max-width:560px){.final-items{grid-template-columns:repeat(2,1fr)}#finalStats{top:8px;padding:8px}.final-items div{padding:5px}}</style>
<style>.final-items div:nth-child(5){animation-delay:1.48s!important;border-color:#ffd35f!important;background:linear-gradient(135deg,#6b3f0a99,#201307dd)!important;box-shadow:0 0 20px #ffd35f55}.leader-stats{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:8px;text-align:center}.leader-stats b{padding:6px 8px;border:2px solid #171717;border-radius:9px;background:#fff;font-size:15px}.leader-stats small{display:block;font-size:9px;text-transform:uppercase;opacity:.62}#leaderRows li>strong{min-width:120px;align-self:center}@media(max-width:620px){#leaderRows li{display:block!important}#leaderRows li>strong{display:block;margin-bottom:8px}.leader-stats{grid-template-columns:repeat(2,1fr)}}</style><script type="module" src="runner.mjs?v=20260814-93"></script></body></html>
