<!DOCTYPE html>
<!--
  projects/game/index.html — игра ребёнка. Открывается во вкладке «Игра» курса
  (iframe) и двойным кликом — без сервера, автономна. Конфиг — config.js
  («настройки игры»), движок и испытания — assets/.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя игра</title>
  <style>
    html, body { margin: 0; min-height: 100vh; background: #f5f1ea; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
    #game-wrap { position: relative; width: max-content; }
    #game { border: 2px solid #1a1a1a; border-radius: 4px; max-width: 90vmin; max-height: 90vmin; display: block; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" tabindex="0"></canvas>
  </div>
  <script src="config.js"></script>
  <script src="assets/mechanics/mechanics.js"></script>
  <script src="assets/mechanics/seek.js"></script>
  <script src="assets/mechanics/fog.js"></script>
  <script src="assets/mechanics/chase.js"></script>
  <script src="assets/mechanics/collect.js"></script>
  <script src="assets/mechanics/arrange.js"></script>
  <script src="assets/mechanics/detective_search.js"></script>
  <script src="assets/mechanics/dialogue_choice.js"></script>
  <script src="assets/mechanics/code_lock.js"></script>
  <script src="assets/mechanics/timeline.js"></script>
  <script src="assets/mechanics/baby_cipher.js"></script>
  <script src="assets/mechanics/alibi_matrix.js"></script>
  <script src="assets/mechanics/accusation_board.js"></script>
  <script src="assets/mechanics/reaction_attack.js"></script>
  <script src="assets/mechanics/final_outcome.js"></script>
  <script src="assets/modules/registry.js"></script>
  <script src="assets/modules/control.js"></script>
  <script src="assets/modules/transitions.js"></script>
  <script src="assets/core.js"></script>
</body>
</html>
