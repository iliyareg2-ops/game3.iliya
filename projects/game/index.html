<!DOCTYPE html>
<!--
  projects/game/index.html — игра ребёнка. Открывается во вкладке «Игра» курса
  (iframe) и двойным кликом — без сервера, автономна. Конфиг — config.js
  («настройки игры»), движок и испытания — assets/.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя игра</title>
  <style>
    html, body { margin: 0; min-height: 100vh; background: #f5f1ea; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
    #game-wrap { position: relative; width: max-content; }
    #game { border: 2px solid #1a1a1a; border-radius: 4px; max-width: 90vmin; max-height: 90vmin; display: block; }
    #asyl-emotion { position: absolute; left: 2%; top: 2%; width: 13%; height: 13%; image-rendering: pixelated; filter: drop-shadow(0 3px 5px rgba(0,0,0,.45)); pointer-events: none; }
    #next-scene { position: absolute; right: 4%; bottom: 4%; border: 0; border-radius: 14px; padding: 13px 22px; color: #fff; background: rgba(28,30,42,.88); font: 700 20px system-ui, sans-serif; cursor: pointer; box-shadow: 0 5px 16px rgba(0,0,0,.3); }
    #next-scene:hover { background: #34394c; transform: scale(1.04); }
    #next-scene[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" tabindex="0"></canvas>
    <canvas id="asyl-emotion" width="180" height="180" aria-label="Эмоция Асыла"></canvas>
    <button id="next-scene" type="button" hidden>Дальше →</button>
  </div>
  <script src="config.js"></script>
  <script src="assets/mechanics/mechanics.js"></script>
  <script src="assets/mechanics/seek.js"></script>
  <script src="assets/mechanics/fog.js"></script>
  <script src="assets/mechanics/chase.js"></script>
  <script src="assets/mechanics/collect.js"></script>
  <script src="assets/mechanics/arrange.js"></script>
  <script src="assets/mechanics/detective_search.js"></script>
  <script src="assets/mechanics/dialogue_choice.js"></script>
  <script src="assets/mechanics/code_lock.js"></script>
  <script src="assets/mechanics/timeline.js"></script>
  <script src="assets/mechanics/baby_cipher.js"></script>
  <script src="assets/mechanics/alibi_matrix.js"></script>
  <script src="assets/mechanics/accusation_board.js"></script>
  <script src="assets/mechanics/reaction_attack.js"></script>
  <script src="assets/mechanics/final_outcome.js"></script>
  <script src="assets/modules/registry.js"></script>
  <script src="assets/modules/control.js"></script>
  <script src="assets/modules/transitions.js"></script>
  <script src="assets/core.js"></script>
  <script>
    const nextSceneButton = document.getElementById("next-scene");
    const emotionCanvas = document.getElementById("asyl-emotion");
    const emotionContext = emotionCanvas.getContext("2d");
    const emotionSheet = new Image();
    let shownEmotion = "";
    let forcedEmotion = "";
    let forcedEmotionUntil = 0;
    emotionSheet.src = "asyl_pixel_emotions_9.png";

    window.showAsylEmotion = (emotion, duration = 1400) => {
      forcedEmotion = emotion;
      forcedEmotionUntil = performance.now() + duration;
      shownEmotion = "";
    };

    function drawAsylEmotion(emotion) {
      if (!emotionSheet.complete || emotion === shownEmotion) return;
      shownEmotion = emotion;
      const cells = {
        neutral: [0, 0], surprised: [1, 0], thinking: [2, 0],
        sad: [0, 1], happy: [1, 1], worried: [2, 1],
        angry: [0, 2], determined: [1, 2], confused: [2, 2],
      };
      const [column, row] = cells[emotion];
      const cellWidth = emotionSheet.naturalWidth / 3;
      const cellHeight = emotionSheet.naturalHeight / 3;
      emotionContext.clearRect(0, 0, 180, 180);
      emotionContext.drawImage(emotionSheet, column * cellWidth, row * cellHeight, cellWidth, cellHeight, 0, 0, 180, 180);
      const pixels = emotionContext.getImageData(0, 0, 180, 180);
      for (let i = 0; i < pixels.data.length; i += 4) {
        const red = pixels.data[i], green = pixels.data[i + 1], blue = pixels.data[i + 2];
        const other = Math.max(red, blue);
        if (green > 70 && green > other * 1.08) {
          const greenStrength = green - other;
          pixels.data[i + 3] = Math.max(0, 255 - greenStrength * 4);
          pixels.data[i + 1] = other;
        }
      }
      emotionContext.putImageData(pixels, 0, 0);
    }

    nextSceneButton.addEventListener("click", () => window.GameAPI.gotoNext());
    function updateNextSceneButton() {
      if (window.GameAPI) {
        const state = window.GameAPI.sceneState();
        nextSceneButton.hidden = !state.complete || state.atLast;
        const lostReaction = state.complete && state.index === 8 && window.DETECTIVE_FLAGS?.fastReaction === false;
        const puzzleEmotions = ["neutral", "thinking", "confused", "determined", "thinking", "worried", "confused", "determined", "worried", "happy"];
        const automaticEmotion = lostReaction ? "sad" : state.complete ? "happy" : puzzleEmotions[state.index] || "surprised";
        drawAsylEmotion(performance.now() < forcedEmotionUntil ? forcedEmotion : automaticEmotion);
      }
      requestAnimationFrame(updateNextSceneButton);
    }
    updateNextSceneButton();
  </script>
</body>
</html>
